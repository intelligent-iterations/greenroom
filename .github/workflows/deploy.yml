name: Deploy

# Manual only. There is no push or schedule trigger, deliberately: this deploys
# to a live origin, and a deploy that happens because someone merged a README
# change is a deploy nobody is watching.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [hosting, functions, firestore-rules, everything]
        default: hosting
      confirm:
        description: Type the project id to confirm (greenroom-ii)
        type: string
        required: true
      skip_gate:
        description: Deploy even if the evaluation gate fails (emergencies only)
        type: boolean
        default: false

concurrency:
  # Two deploys racing to the same origin is how a half-published site happens.
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the target project
        # A typed confirmation, because the choice above makes it easy to fire
        # this without reading which project it points at.
        run: |
          if [ "${{ inputs.confirm }}" != "greenroom-ii" ]; then
            echo "::error::Confirmation did not match the project id. Nothing deployed."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm build:shared
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Unit tests
        run: pnpm -r test

      - name: Evaluation gate
        id: gate
        continue-on-error: ${{ inputs.skip_gate }}
        run: pnpm eval:gate

      - name: Note a skipped gate
        if: inputs.skip_gate && steps.gate.outcome == 'failure'
        run: echo "::warning::Evaluation gate failed and was skipped by request."

  deploy:
    name: Deploy ${{ inputs.target }}
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared

      - name: Build the web app
        if: inputs.target == 'hosting' || inputs.target == 'everything'
        # No INCLUDE_DEV_PAGES: the benchmark, eval runner and probes are
        # instruments, and publishing pages that download gigabytes of models
        # to a public origin is not something to do by accident.
        run: pnpm --filter @greenroom/web build

      - name: Build the functions bundle
        if: inputs.target == 'functions' || inputs.target == 'everything'
        run: pnpm --filter @greenroom/functions build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy
        env:
          FIREBASE_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          case "${{ inputs.target }}" in
            hosting)         ONLY=hosting ;;
            functions)       ONLY=functions ;;
            firestore-rules) ONLY=firestore ;;
            everything)      ONLY=hosting,functions,firestore ;;
          esac
          npx --yes firebase-tools@latest deploy --only "$ONLY" \
            --project "$FIREBASE_PROJECT" --non-interactive --force

      # The checks that were previously run by hand after every deploy. Each one
      # corresponds to a failure that actually happened.
      - name: Verify the deployed site
        if: inputs.target == 'hosting' || inputs.target == 'everything'
        run: |
          SITE="https://${{ secrets.GCP_PROJECT_ID }}.web.app"
          fail=0

          echo "== cross-origin isolation =="
          # Without these the WASM fallback loses its threads and gets ~3x slower
          # in production while remaining fine in dev.
          headers=$(curl -sI "$SITE")
          echo "$headers" | grep -qi "cross-origin-opener-policy: same-origin" \
            || { echo "::error::COOP header missing"; fail=1; }
          echo "$headers" | grep -qi "cross-origin-embedder-policy: credentialless" \
            || { echo "::error::COEP header missing"; fail=1; }

          echo "== VAD runtime assets =="
          # The SPA rewrite answers anything missing with index.html and a 200,
          # so status alone proves nothing. A text/html content type here means
          # the asset is absent and the microphone will be dead.
          for asset in vad/silero_vad_v5.onnx vad/vad.worklet.bundle.min.js vad/ort-wasm-simd-threaded.jsep.wasm; do
            ctype=$(curl -sI "$SITE/$asset" | grep -i '^content-type' | tr -d '\r')
            echo "  $asset -> ${ctype:-none}"
            case "$ctype" in
              *text/html*) echo "::error::$asset is missing (SPA fallback served index.html)"; fail=1 ;;
              "")          echo "::error::$asset returned no content type"; fail=1 ;;
            esac
          done

          echo "== instruments must not be published =="
          for page in bench.html evals.html probe.html vadcheck.html diag.html; do
            if curl -s "$SITE/$page" | grep -qiE "on-device benchmark|Greenroom evals|<title>probe|vad check|<title>diag"; then
              echo "::error::$page is published to the public origin"; fail=1
            fi
          done

          echo "== app shell =="
          curl -s "$SITE" | grep -q "<title>" || { echo "::error::no app shell served"; fail=1; }

          [ "$fail" -eq 0 ] && echo "All post-deploy checks passed." || exit 1

      - name: Verify the functions
        if: inputs.target == 'functions' || inputs.target == 'everything'
        run: |
          SITE="https://${{ secrets.GCP_PROJECT_ID }}.web.app"
          # Unauthenticated calls must be rejected by the handler's own token
          # check, not merely by platform IAM.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$SITE/api/generate" \
            -H 'Content-Type: application/json' -d '{}')
          echo "POST /api/generate -> $code"
          [ "$code" = "401" ] || { echo "::error::expected 401 without a token, got $code"; exit 1; }

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deploy: ${{ inputs.target }}"
            echo ""
            echo "- Project: \`${{ secrets.GCP_PROJECT_ID }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Triggered by: @${{ github.actor }}"
            echo "- Site: https://${{ secrets.GCP_PROJECT_ID }}.web.app"
          } >> "$GITHUB_STEP_SUMMARY"
