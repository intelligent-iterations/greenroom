name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token this workflow hands to every third-party action. Declared read-only
# rather than inherited: the repository default can be read-write, and on a
# public repo that turns any compromised build-step dependency into push
# access. Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Java for the Firestore emulator
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'


      # Every other package consumes the shared package's build output, so this
      # has to happen before typecheck rather than as part of it.
      - name: Build shared package
        run: pnpm build:shared

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Unit tests
        run: pnpm -r test

      # Called out separately because a failure here is a security boundary
      # regression, not a normal test failure: these rules are the only thing
      # stopping a client rewriting the mastery scores that decide what it is
      # asked next. Blocking, deliberately.
      - name: Firestore security rules
        run: pnpm --filter @greenroom/rules test

      - name: Build web app
        run: pnpm --filter @greenroom/web build

      # Runs against stored reference turns with deterministic checks only, so
      # it needs no vendor credentials and gates every pull request. It cannot
      # catch a model regression — that needs the live job below — but it does
      # catch a prompt or check regression, which is what a PR usually breaks.
      - name: Evaluation quality gate
        run: pnpm eval:gate

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-report
          path: evals/reports/
          retention-days: 14
